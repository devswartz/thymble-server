name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install "uv==0.12.5"
      - name: Install dependencies
        run: uv sync --locked
      - name: ruff format
        run: uv run ruff format --check .
      - name: ruff check
        run: uv run ruff check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: thymble
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: thymble
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U thymble"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://thymble:ci-only-password@localhost:5432/thymble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install "uv==0.12.5"
      - name: Install dependencies
        run: uv sync --locked
      - name: pytest
        run: uv run pytest -v
