<h2>Oat Drop Cookies</h2>
<p>Makes about 24.</p>
<p>1 cup butter, softened<br>1 cup brown sugar<br>2 eggs<br>3 cups rolled oats</p>
<p>Cream the butter and sugar, beat in the eggs, stir in the oats. Drop by spoonfuls and bake 12 minutes.</p>
